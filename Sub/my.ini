[custom]

# common
quanx_rule_base=https://raw.githubusercontent.com/3dot141/Fake-Free-Rules/refs/heads/main/Sub/config/quanx.conf
clash_rule_base=https://raw.githubusercontent.com/3dot141/Fake-Free-Rules/refs/heads/main/Sub/config/all_base.tpl

# managed_config（2026-11 审计：service.yes365.fun:40008 已 404，暂停托管前缀，恢复时取消注释）
# managed_config_prefix=https://service.yes365.fun:40008

# ruleset
ruleset=!!import:https://raw.githubusercontent.com/3dot141/Fake-Free-Rules/refs/heads/main/Sub/snippets/rulesets.txt

# group
custom_proxy_group=!!import:https://raw.githubusercontent.com/3dot141/Fake-Free-Rules/refs/heads/main/Sub/snippets/groups.txt

# 链式代理：AI 流量 → 香港前置 → 日本家宽(miyaip)落地
# 语法: chain=名字`前置`落地
#   前置  []组名 引用已有分组，或节点备注正则（正则时自动生成 <名字>-front 组）
#   落地  节点备注，必须唯一命中
# 必须写在 custom_proxy_group 之后，链式解析要按名字查前置组
chain=AI-Chain`[]日本`日本-东京-miyaip
